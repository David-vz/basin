html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #1f2847;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1f2847;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress {
	display: none;
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

/* A message over the page, on the game's own paper (docs/interface.md). */
.basin-over {
	position: fixed;
	inset: 0;
	z-index: 5;
	display: grid;
	place-items: center;
	padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
	box-sizing: border-box;
	background: rgba(15, 18, 38, 0.6);
	touch-action: auto;
	overflow: auto;
}

.basin-over.alone {
	background: #1f2847;
}

.basin-over.aside {
	place-items: start center;
	background: none;
	pointer-events: none;
}

.basin-over > div {
	box-sizing: border-box;
	width: min(100%, 400px);
	padding: 18px 20px;
	border-radius: 16px;
	border: 2px solid #b79f72;
	background: #fbf3df;
	color: #3a2f2a;
	font: 600 16px/1.4 system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
	pointer-events: auto;
}

.basin-over h2 {
	margin: 0 0 6px;
	font-size: 20px;
	line-height: 1.2;
}

.basin-over p {
	margin: 0 0 14px;
}

.basin-over textarea {
	box-sizing: border-box;
	width: 100%;
	height: 88px;
	margin: 0 0 12px;
	padding: 8px 10px;
	border-radius: 10px;
	border: 2px solid #b79f72;
	background: #fffaf0;
	color: inherit;
	font: 16px/1.35 ui-monospace, Consolas, monospace;
	resize: none;
}

.basin-over .row {
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
}

.basin-over button {
	flex: 1 1 auto;
	min-height: 48px;
	padding: 0 18px;
	border-radius: 12px;
	border: 2px solid #463a32;
	border-bottom-width: 5px;
	background: #e3d8c3;
	color: #3a2f2a;
	font: inherit;
	font-weight: 800;
	cursor: pointer;
	touch-action: manipulation;
}

.basin-over button.main {
	border-color: #5a3512;
	background: #f7b64e;
	color: #43260c;
}

.basin-over button:focus, .basin-over textarea:focus {
	outline: 3px solid #155672;
	outline-offset: 2px;
}

		if (quietly(function () { sessionStorage.setItem('basin.mixed', BUILD); return true; })) { location.reload(); }

	api.store.write = function (k, v) {

	quietly(function () { sessionStorage.removeItem('basin.back'); });

	/* buttons: [[label, action, main]]. how: 'aside', a line that stops nothing; 'alone', for a

		var over = shown = el('div');

		if (body) { el('p', body, box); }

	}
	function key(row, b) {
		var k = el('button', b[0], row);
		k.type = 'button';
		if (b[2]) { k.className = 'main'; }
		k.addEventListener('click', b[1]);

		Array.prototype.forEach.call(quietly(function () { return navigator.getGamepads(); }) || [], function (p) {
			if (!p || !p.connected) { return; }
			p.buttons.forEach(function (b, k) { if (b.pressed) { now[k] = true; } });
			if (p.axes[0] < -0.6 || p.axes[1] < -0.6) { now[12] = true; }
			if (p.axes[0] > 0.6 || p.axes[1] > 0.6) { now[13] = true; }
		});
		function hit(k) { return padWas && now[k] && !padWas[k]; }
		var all = Array.prototype.slice.call(over.querySelectorAll('button')), at = all.indexOf(document.activeElement);
		if (hit(12) || hit(14)) { (all[at - 1] || all[all.length - 1]).focus(); }
		if (hit(13) || hit(15)) { (all[at + 1] || all[0]).focus(); }
		if (hit(1) && cancel) { cancel(); } else if (hit(0)) { (all[at] || all[0]).click(); }

	var SLOW_MS = 12000, STUCK_MS = 60000, moved = Date.now(), done = false, started = false, up = false, slow = false;
	/* Once more, and past whatever the browser kept of the last try. */

	function moving() {

	}
	api.progress = function (now, of) {

	};

	};

	/* --- a save brought in ---------------------------------------------------------------------- */
	/* Real text and file boxes, so the browser's own paste and file picker work. */

			['Open a file', function () { pick.click(); }], ['Back', shut]].forEach(function (b) { key(row, b); });

<script>
/* iPhone haptics (scripts/audio/haptics.gd). Safari 18+ has no navigator.vibrate,
   but toggling a hidden switch control plays the system haptic, only inside a user
   gesture. The board acts on the finger's lift, which the game reads a frame after
   touchend, so while a held finger aims at a move the game calls pgHaptic.arm(true)
   and the lift's own touchend plays the tick. pgHaptic.tick() (the move itself) then
   finds it played. A tap too quick to arm ticks from tick() at once, just after the
   lift. Elsewhere it is unsupported and does nothing. */
(function () {
	var probe = document.createElement('input');
	var supported = !('vibrate' in navigator) && ('switch' in probe);

	var armed = false;
	var armedFired = -1e9;
	var api = window.pgHaptic = { supported: supported, pending: false, pendingAt: 0, fired: 0, tick: function () {
		if (!api.supported) { return false; }
		/* The lift that made this move already played its tick (arm). */
		if (performance.now() - armedFired < 400) { armedFired = -1e9; return true; }
		api.pending = true;
		api.pendingAt = performance.now();
		/* The finger already lifted (a very quick tap): try at once, still close to the gesture. */
		if (api.pendingAt - lastUp < 400) { fire(); }
		return true;
	}, arm: function (on) {
		if (!api.supported) { return false; }
		armed = !!on;
		return true;
	} };
	if (!supported) { return; }
	var label = document.createElement('label');
	var input = document.createElement('input');
	input.type = 'checkbox';
	input.setAttribute('switch', '');
	input.tabIndex = -1;
	label.setAttribute('aria-hidden', 'true');
	label.style.cssText = 'position:fixed;left:-99px;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none';
	label.appendChild(input);
	/* Clicking the switch moves focus to it and back, inside the finger's touchend.
	   The game must never see that: a blur reads as the window losing focus, which
	   cancels the tap being lifted (and releases held input), so a real iPhone
	   could not place a pin. While the switch clicks, the focus events stop at the
	   window, before they reach the canvas. */
	var clicking = false;
	['blur', 'focus', 'focusout', 'focusin'].forEach(function (type) {
		window.addEventListener(type, function (event) {
			if (clicking) { event.stopImmediatePropagation(); }
		}, true);
	});
	function fire() {
		if (!api.pending) { return; }
		api.pending = false;
		/* A tick left over from a tap that never ended is dropped, not played on a later tap. */
		if (performance.now() - api.pendingAt > 800) { return; }
		if (!label.isConnected) { document.body.appendChild(label); }
		var active = document.activeElement;
		clicking = true;
		try {
			label.click();
			api.fired += 1;
			if (active && active !== document.activeElement && active.focus) { active.focus({ preventScroll: true }); }
		} finally {
			clicking = false;
		}
	}
	['touchend', 'pointerup', 'mouseup'].forEach(function (type) {
		document.addEventListener(type, function () {
			lastUp = performance.now();
			if (armed) {
				armed = false;
				api.pending = true;
