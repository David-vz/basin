<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Basin</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1f2847;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
/* iPhone haptics (scripts/audio/haptics.gd). Safari 18+ has no navigator.vibrate,
   but toggling a hidden switch control plays the system haptic, only inside a user
   gesture. The board acts on the finger's lift, which the game reads a frame after
   touchend, so while a held finger aims at a move the game calls pgHaptic.arm(true)
   and the lift's own touchend plays the tick. pgHaptic.tick() (the move itself) then
   finds it played. A tap too quick to arm ticks from tick() at once, just after the
   lift. Elsewhere it is unsupported and does nothing. */
(function () {
	var probe = document.createElement('input');
	var supported = !('vibrate' in navigator) && ('switch' in probe);
	var lastUp = -1e9;
	var armed = false;
	var armedFired = -1e9;
	var api = window.pgHaptic = { supported: supported, pending: false, pendingAt: 0, fired: 0, tick: function () {
		if (!api.supported) { return false; }
		/* The lift that made this move already played its tick (arm). */
		if (performance.now() - armedFired < 400) { armedFired = -1e9; return true; }
		api.pending = true;
		api.pendingAt = performance.now();
		/* The finger already lifted (a very quick tap): try at once, still close to the gesture. */
		if (api.pendingAt - lastUp < 400) { fire(); }
		return true;
	}, arm: function (on) {
		if (!api.supported) { return false; }
		armed = !!on;
		return true;
	} };
	if (!supported) { return; }
	var label = document.createElement('label');
	var input = document.createElement('input');
	input.type = 'checkbox';
	input.setAttribute('switch', '');
	input.tabIndex = -1;
	label.setAttribute('aria-hidden', 'true');
	label.style.cssText = 'position:fixed;left:-99px;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none';
	label.appendChild(input);
	/* Clicking the switch moves focus to it and back, inside the finger's touchend.
	   The game must never see that: a blur reads as the window losing focus, which
	   cancels the tap being lifted (and releases held input), so a real iPhone
	   could not place a pin. While the switch clicks, the focus events stop at the
	   window, before they reach the canvas. */
	var clicking = false;
	['blur', 'focus', 'focusout', 'focusin'].forEach(function (type) {
		window.addEventListener(type, function (event) {
			if (clicking) { event.stopImmediatePropagation(); }
		}, true);
	});
	function fire() {
		if (!api.pending) { return; }
		api.pending = false;
		/* A tick left over from a tap that never ended is dropped, not played on a later tap. */
		if (performance.now() - api.pendingAt > 800) { return; }
		if (!label.isConnected) { document.body.appendChild(label); }
		var active = document.activeElement;
		clicking = true;
		try {
			label.click();
			api.fired += 1;
			if (active && active !== document.activeElement && active.focus) { active.focus({ preventScroll: true }); }
		} finally {
			clicking = false;
		}
	}
	['touchend', 'pointerup', 'mouseup'].forEach(function (type) {
		document.addEventListener(type, function () {
			lastUp = performance.now();
			if (armed) {
				armed = false;
				api.pending = true;
				api.pendingAt = lastUp;
				armedFired = lastUp;
			}
			fire();
		}, { capture: true, passive: true });
	});
})();
</script>
<script>
/* Shader link-ahead. Most of the boot used to be WebGL linking shader programs:
   Godot links them one at a time and waits on each. Browsers link in parallel when
   nobody waits (KHR_parallel_shader_compile: Chromium, Safari, Firefox), so the page
   links the whole boot's programs itself, in Godot's own WebGL context, and when
   Godot links a program with the same two sources it is handed the finished one
   (its WebGLProgram stands for ours: every call that takes it is passed ours).
   The sources come from a manifest recorded from a headless boot, one per quality
   tier and water look (tools/web/link_manifest.py, assets/web/): fetched beside this
   page as soon as it opens, so the links run while the engine downloads (the export
   plugin, addons/basin_export, puts index.links_<tier>_<look>.json there). As it
   starts, the game names the one it needs (scripts/web/link_ahead.gd), in case the
   page guessed another. Programs the manifest lacks are linked
   as Godot asks, and a land or object shader's other modes are guessed from its
   first one (siblings). Nothing breaks when a manifest is stale: only time is lost.
   window.__linkAhead counts for the tests; ?links=off turns it off.
   This file is tools/web/link_ahead.js, embedded in the Web preset's head include by
   tools/web/embed_head.py: edit it there (no double quotes). */
(function () {
	/* The engine looks for a few hundred files that are not there as it starts, and each
	   miss throws an Error whose stack trace (through the whole engine) is dear: 0.45 s
	   of a throttled phone's start. No traces until the game is up. */
	var limit = Error.stackTraceLimit, quiet = /[?&]traces=on/.test(location.search) ? 0 : setInterval(function () {
		if (window.__basin) { clearInterval(quiet); Error.stackTraceLimit = limit; }
	}, 500);
	if (quiet) { Error.stackTraceLimit = 0; }
	var NL = String.fromCharCode(10);
	var stats = window.__linkAhead = { ahead: 0, hits: 0, misses: 0, failed: 0, waited_ms: 0, off: true, manifest: '', early: false };
	if (typeof WebGL2RenderingContext === 'undefined' || /[?&]links=off/.test(location.search)) { return; }
	var P = WebGL2RenderingContext.prototype;
	var COMPILE_STATUS = P.COMPILE_STATUS, LINK_STATUS = P.LINK_STATUS, ACTIVE_UNIFORMS = P.ACTIVE_UNIFORMS, VERTEX = P.VERTEX_SHADER;
	var raw = {};
	['createProgram', 'createShader', 'shaderSource', 'compileShader', 'attachShader', 'linkProgram', 'getProgramParameter', 'getShaderParameter',
		'getExtension', 'deleteProgram', 'deleteShader', 'getActiveUniform', 'getActiveUniforms', 'transformFeedbackVaryings',
		'bindAttribLocation', 'useProgram'].forEach(function (n) { raw[n] = P[n]; });
	var gl = null, waiting = new Map(), linked = new Set(), queued = null, also = {};
	stats.off = false;

	function load(type, src) {
		var sh = raw.createShader.call(gl, type);
		raw.shaderSource.call(gl, sh, src);
		raw.compileShader.call(gl, sh);
		return sh;
	}
	/* Starts linking one program; `waiting` holds it until Godot asks for it. */
	function ahead(vs, fs) {
		var prog = raw.createProgram.call(gl), key = vs + fs;
		[load(gl.VERTEX_SHADER, vs), load(gl.FRAGMENT_SHADER, fs)].forEach(function (sh) {
			raw.attachShader.call(gl, prog, sh);
			raw.deleteShader.call(gl, sh);
		});
		raw.linkProgram.call(gl, prog);
		if (!waiting.has(key)) { waiting.set(key, []); }
		waiting.get(key).push(prog);
		stats.ahead += 1;
	}

	/* --- the manifest ------------------------------------------------------- */
	/* Stages are stored once each: a string, or a line diff against an earlier one:
	   [its index, then n keeps n lines, -n skips n, a string inserts lines]. */
	function unpack(stages) {
		var out = [], lines = [];
		stages.forEach(function (s) {
			if (typeof s === 'string') { out.push(s); return; }
			var a = lines[s[0]] || (lines[s[0]] = out[s[0]].split(NL)), b = [], i = 0;
			for (var n = 1; n < s.length; n++) {
				var op = s[n];
				if (typeof op === 'string') { b.push(op); } else if (op >= 0) { b.push(a.slice(i, i + op).join(NL)); i += op; } else { i -= op; }
			}
			out.push(b.join(NL));
		});
		return out;
	}
	function start(name, man) {
		if (!gl || stats.manifest === name) { return; }
		stats.manifest = name;
		var s = unpack(man.stages);
		man.progs.forEach(function (p) { ahead(s[p[0]], s[p[1]]); });
	}
	/* A program's fingerprint (the texts are too long to keep). */
	function print(vs, fs) {
		var h = 0;
		for (var i = 0; i < vs.length; i += 31) { h = (Math.imul(h, 33) + vs.charCodeAt(i)) | 0; }
		for (i = 0; i < fs.length; i += 31) { h = (Math.imul(h, 33) + fs.charCodeAt(i)) | 0; }
		return vs.length + ':' + fs.length + ':' + h;
	}
	/* Another water look's programs, those this boot has not linked: called as Settings
	   opens, so a switch finds them linked. */
	stats.also = function (names) {
		names.forEach(function (name) {
			if (!gl || also[name] || stats.manifest === name) { return; }
			also[name] = true;
			get(name).then(function (man) {
				if (!man) { return; }
				var s = unpack(man.stages);
				man.progs.forEach(function (p) {
					if (!linked.has(print(s[p[0]], s[p[1]])) && !waiting.has(s[p[0]] + s[p[1]])) { ahead(s[p[0]], s[p[1]]); }
				});
			});
		});
	};
	function get(name) {
		return fetch('index.links_' + name + '.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
	}
	/* The game's call (link_ahead.gd): the manifest this boot needs. Fetched here if the
	   page guessed another, and remembered for the next visit. */
	stats.want = function (name) {
		try { localStorage.setItem('basin_links', name); } catch (e) { /* private mode */ }
		if (gl && stats.manifest !== name) { get(name).then(function (man) { if (man) { start(name, man); } }); }
	};

	/* --- Godot's context ------------------------------------------------------ */
	function adopt(ctx) {
		if (!ctx || gl) { return; }
		gl = ctx;
		/* The extensions Emscripten turns on change how shaders are translated. */
		(ctx.getSupportedExtensions() || []).forEach(function (n) {
			if (n.indexOf('lose_context') < 0 && n.indexOf('debug') < 0) { raw.getExtension.call(ctx, n); }
		});
		if (queued) { start(queued[0], queued[1]); }
	}
	var getContext = HTMLCanvasElement.prototype.getContext;
	HTMLCanvasElement.prototype.getContext = function (type, attrs) {
		var ctx = getContext.apply(this, arguments);
		if (type === 'webgl2' && this.id === 'canvas') {
			/* What Godot asked for, for the tests: the manifest's attributes must be the same. */
			stats.attrs = attrs;
			adopt(ctx);
		}
		return ctx;
	};

	/* The manifest beside the page: fetched now. Once the canvas is there its context
	   is made with the attributes Godot will ask for (recorded in the manifest);
	   Godot's own getContext then returns the same one. */
	(function () {
		var name = '', canvas = null, man = null;
		try { name = localStorage.getItem('basin_links') || ''; } catch (e) { /* private mode */ }
		var q = /[?&]water=(off|blob|goo)/.exec(location.search), ua = navigator.userAgent;
		if (!/^(low|high)_(off|blob|goo)$/.test(name)) {
			/* As GfxTier picks it, and the default water. */
			name = (/Android|iPhone|iPad|iPod/.test(ua) || ('ontouchstart' in window && screen.width < 1200) ? 'low' : 'high') + '_goo';
		}
		if (q) { name = name.split('_')[0] + '_' + q[1]; }
		function go() {
			if (!man || !canvas) { return; }
			if (gl) { start(name, man); return; }
			stats.early = true;
			queued = [name, man];
			getContext.call(canvas, 'webgl2', Object.assign({}, man.attrs));
			adopt(getContext.call(canvas, 'webgl2'));
		}
		document.addEventListener('DOMContentLoaded', function () { canvas = document.getElementById('canvas'); go(); });
		if (location.protocol === 'file:') { return; }
		get(name).then(function (m) { man = m; go(); });
	})();

	/* --- programs Godot links ------------------------------------------------- */
	/* Every call that takes a program gets ours where Godot's stands for it. */
	['getActiveAttrib', 'getActiveUniformBlockName', 'getActiveUniformBlockParameter', 'getActiveUniforms', 'getAttachedShaders',
		'getAttribLocation', 'getFragDataLocation', 'getProgramInfoLog', 'getTransformFeedbackVarying', 'getUniform', 'getUniformBlockIndex',
		'getUniformIndices', 'getUniformLocation', 'isProgram', 'uniformBlockBinding', 'validateProgram'].forEach(function (n) {
		var f = P[n];
		P[n] = function (p) {
			if (p && p.__ours !== undefined) { arguments[0] = p.__ours; }
			return f.apply(this, arguments);
		};
	});
	P.useProgram = function (p) { return raw.useProgram.call(this, p !== null && p.__ours !== undefined ? p.__ours : p); };
	/* Giving the browser a source and compiling it wait until a link needs them: most
	   sources are in the manifest. */
	P.shaderSource = function (sh, src) {
		if (this !== gl) { return raw.shaderSource.call(this, sh, src); }
		sh.__src = src;
		return undefined;
	};
	P.compileShader = function (sh) {
		if (this !== gl) { return raw.compileShader.call(this, sh); }
		sh.__lazy = true;
		return undefined;
	};
	function compileNow(sh) {
		if (!sh.__lazy) { return; }
		sh.__lazy = false;
		raw.shaderSource.call(gl, sh, sh.__src);
		raw.compileShader.call(gl, sh);
	}
	P.getShaderParameter = function (sh, what) {
		if (sh && sh.__lazy && what === COMPILE_STATUS) { return true; }
		return raw.getShaderParameter.call(this, sh, what);
	};
	P.createShader = function (type) {
		var sh = raw.createShader.call(this, type);
		if (sh) { sh.__type = type; }
		return sh;
	};
	P.attachShader = function (prog, sh) {
		if (prog && sh) { (prog.__sh = prog.__sh || []).push(sh); }
		return raw.attachShader.call(this, prog, sh);
	};
	['transformFeedbackVaryings', 'bindAttribLocation'].forEach(function (n) {
		P[n] = function (prog) { prog.__own = true; return raw[n].apply(this, arguments); };
	});
	P.deleteProgram = function (prog) {
		if (prog && prog.__ours !== undefined) { raw.deleteProgram.call(this, prog.__ours); }
		return raw.deleteProgram.call(this, prog);
	};
	P.linkProgram = function (prog) {
		if (this !== gl) { return raw.linkProgram.call(this, prog); }
		var vs = null, fs = null, list = prog.__sh || [];
		list.forEach(function (sh) { if (sh.__type === VERTEX) { vs = sh.__src; } else { fs = sh.__src; } });
		if (vs && fs && !prog.__own && prog.__ours === undefined) {
			var key = vs + fs, hit = waiting.get(key);
			linked.add(print(vs, fs));
			if (hit) {
				var ours = hit.shift();
				if (!hit.length) { waiting.delete(key); }
				var t = performance.now();
				var ok = raw.getProgramParameter.call(gl, ours, LINK_STATUS);
				stats.waited_ms += performance.now() - t;
				if (ok) {
					prog.__ours = ours;
					stats.hits += 1;
					/* 12 MB of text, over the boot. */
					list.forEach(function (sh) { sh.__src = undefined; });
					return undefined;
				}
				stats.failed += 1;
				raw.deleteProgram.call(gl, ours);
			} else {
				stats.misses += 1;
				siblings(vs, fs);
			}
		}
		list.forEach(function (sh) { compileNow(sh); sh.__src = undefined; });
		return raw.linkProgram.call(this, prog);
	};
	/* Emscripten lists a program's every active uniform once, one call each, to find
	   the loose ones; about nine in ten sit in uniform blocks and have no location:
	   list only the loose ones (one call says which). */
	function loose(prog) {
		if (prog.__loose === undefined) {
			var n = raw.getProgramParameter.call(gl, prog, ACTIVE_UNIFORMS), all = [];
			for (var i = 0; i < n; i++) { all.push(i); }
			var blocks = n ? raw.getActiveUniforms.call(gl, prog, all, gl.UNIFORM_BLOCK_INDEX) : [];
			prog.__loose = blocks ? all.filter(function (k) { return blocks[k] === -1; }) : all;
		}
		return prog.__loose;
	}
	P.getProgramParameter = function (prog, what) {
		var p = prog && prog.__ours !== undefined ? prog.__ours : prog;
		if (p && this === gl && what === ACTIVE_UNIFORMS) { return loose(p).length; }
		return raw.getProgramParameter.call(this, p, what);
	};
	P.getActiveUniform = function (prog, i) {
		var p = prog && prog.__ours !== undefined ? prog.__ours : prog;
		return raw.getActiveUniform.call(this, p, p && this === gl ? loose(p)[i] : i);
	};
	/* Every frame Emscripten asks whether the scissor test is on with getParameter,
	   which Chromium answers with a round trip to its GPU process (it waits for the
	   whole frame's calls to be taken up); isEnabled answers the same at once. */
	var getParameter = P.getParameter;
	P.getParameter = function (what) {
		return what === 0xC11 && this === gl ? this.isEnabled(0xC11) : getParameter.call(this, what);
	};
	/* Links nobody asked for (a stale manifest) are let go once the game has run a while. */
	var swept = setInterval(function () {
		if (!gl || !window.__basin || !window.__basin.warm_all) { return; }
		clearInterval(swept);
		setTimeout(function () {
			if (Object.keys(also).length) { return; }
			stats.unused = waiting.size;
			waiting.forEach(function (list) { list.forEach(function (p) { raw.deleteProgram.call(gl, p); }); });
			waiting.clear();
		}, 10000);
	}, 2000);

	/* --- a scene shader's other modes ------------------------------------------ */
	/* For a material the manifest does not know: the modes Godot links right after
	   its first program are the same text with one define line changed. */
	var MARK = '#define MAX_ROUGHNESS_LOD';
	var MODES = [NL, NL + '#define USE_INSTANCING' + NL, '#define MODE_RENDER_DEPTH' + NL, '#define MODE_RENDER_DEPTH ' + NL + '#define USE_INSTANCING' + NL];
	var BASE = ['DISABLE_REFLECTION_PROBE', 'USE_RADIANCE_MAP', 'BASE_PASS', 'APPLY_TONEMAPPING'].map(function (n) { return '#define ' + n + NL; }).join('');
	function split(src) {
		var i = src.indexOf(MARK);
		if (src.indexOf('#version') !== 0 || i < 0) { return null; }
		var j = src.indexOf(NL, i) + 1, a = src.indexOf(NL) + 1;
		if (src.substr(a, 23) === '#define USE_HALF2FLOAT' + NL) { a += 23; }
		if (src.substr(a, BASE.length) !== BASE || src.charAt(j) !== NL || src.substr(j, MODES[1].length) === MODES[1]) { return null; }
		return [src.slice(0, j), src.slice(j + 1)];
	}
	function siblings(vs, fs) {
		var v = split(vs), f = split(fs);
		if (!v || !f) { return; }
		for (var m = 1; m < 4; m++) {
			var a = v[0] + MODES[m] + v[1], b = f[0] + MODES[m] + f[1];
			if (!waiting.has(a + b)) { ahead(a, b); }
		}
	}
})();
</script>
<script>
/* Texture family. The GPU-compressed textures ship twice, for GPUs that read s3tc
   (desktops) and for the rest (etc2: phones), each in a pack beside the main one
   (addons/basin_export). This downloads the one Godot will ask for on this GPU (it
   takes s3tc wherever the extension is there) while the engine downloads;
   scripts/web/link_ahead.gd loads it before anything needs a texture.
   An export without the packs (404) keeps them in the main pack.
   This file is tools/web/pick_textures.js, embedded by tools/web/embed_head.py. */
(function () {
	if (location.protocol === 'file:') { return; }
	var family = 'etc2';
	try {
		var probe = document.createElement('canvas').getContext('webgl2');
		if ((probe.getSupportedExtensions() || []).indexOf('WEBGL_compressed_texture_s3tc') >= 0) { family = 's3tc'; }
		var lose = probe.getExtension('WEBGL_lose_context');
		if (lose) { lose.loseContext(); }
	} catch (e) { /* the page itself says when WebGL is missing */ }
	/* tools/web/climate_pack.js fetches the same family later. */
	window.__basinTextureFamily = family;
	function load(tries) {
		return fetch('index.tex_' + family + '.pck').then(function (r) {
			if (r.status === 404) { return null; }
			if (!r.ok) { throw new Error('Failed loading the textures'); }
			return r.arrayBuffer();
		}).catch(function (e) {
			if (tries <= 1) { throw e; }
			return new Promise(function (go) { setTimeout(go, 1000); }).then(function () { return load(tries - 1); });
		});
	}
	var textures = load(4).then(function (pack) { window.__basinTextures = pack ? new Uint8Array(pack) : null; });
	textures.catch(function () { /* the pack's fetch, below, passes it on */ });
	/* The engine starts once it has its main pack: give it that when the textures are in too. */
	var get = window.fetch;
	window.fetch = function (what) {
		var got = get.apply(this, arguments);
		if (!/(^|\/)index\.pck$/.test(String(what))) { return got; }
		window.fetch = get;
		return textures.then(function () { return got; });
	};
})();
</script>
<script>
/* Climate maps. The ground maps of every climate but the meadow (assets/textures/climates)
   ship in a pack of their own per texture family, index.clim_<family>.pck
   (addons/basin_export), so a first visit does not wait for them. The game asks for
   it on its first frame (scripts/view/climate.gd, Climate.poll); until it is in, those
   islands draw with the meadow maps tinted their way. state: idle, loading, ready
   (data holds the pack), none (an export without the pack: the maps are in the main
   one) or failed (offline: the game asks again at the next island). askedAtFrame is
   the frame the game had drawn when it first asked.
   This file is tools/web/climate_pack.js, embedded by tools/web/embed_head.py. */
(function () {
	var api = window.__basinClimates = { state: 'idle', data: null, askedAtFrame: -1, start: function (frame) {
		if (api.state !== 'idle' && api.state !== 'failed') { return; }
