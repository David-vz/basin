		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1f2847;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
/* iPhone haptics (scripts/audio/haptics.gd). Safari 18+ has no navigator.vibrate,
   but toggling a hidden switch control plays the system haptic, only inside a user
   gesture. The board acts on the finger's lift, which the game reads a frame after
   touchend, so while a held finger aims at a move the game calls pgHaptic.arm(true)
   and the lift's own touchend plays the tick. pgHaptic.tick() (the move itself) then
   finds it played. A tap too quick to arm ticks from tick() at once, just after the
   lift. Elsewhere it is unsupported and does nothing. */
(function () {
	var probe = document.createElement('input');
	var supported = !('vibrate' in navigator) && ('switch' in probe);
	var lastUp = -1e9;
	var armed = false;
	var armedFired = -1e9;
	var api = window.pgHaptic = { supported: supported, pending: false, pendingAt: 0, fired: 0, tick: function () {
		if (!api.supported) { return false; }
		/* The lift that made this move already played its tick (arm). */
		if (performance.now() - armedFired < 400) { armedFired = -1e9; return true; }
		api.pending = true;
		api.pendingAt = performance.now();
		/* The finger already lifted (a very quick tap): try at once, still close to the gesture. */
		if (api.pendingAt - lastUp < 400) { fire(); }
		return true;
	}, arm: function (on) {
		if (!api.supported) { return false; }
		armed = !!on;
		return true;
	} };
	if (!supported) { return; }
	var label = document.createElement('label');
	var input = document.createElement('input');
	input.type = 'checkbox';
	input.setAttribute('switch', '');
	input.tabIndex = -1;
	label.setAttribute('aria-hidden', 'true');
	label.style.cssText = 'position:fixed;left:-99px;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none';
	label.appendChild(input);
	/* Clicking the switch moves focus to it and back, inside the finger's touchend.
	   The game must never see that: a blur reads as the window losing focus, which
	   cancels the tap being lifted (and releases held input), so a real iPhone
	   could not place a pin. While the switch clicks, the focus events stop at the
	   window, before they reach the canvas. */
	var clicking = false;
	['blur', 'focus', 'focusout', 'focusin'].forEach(function (type) {
		window.addEventListener(type, function (event) {
			if (clicking) { event.stopImmediatePropagation(); }
		}, true);
	});
	function fire() {
		if (!api.pending) { return; }
		api.pending = false;
		/* A tick left over from a tap that never ended is dropped, not played on a later tap. */
		if (performance.now() - api.pendingAt > 800) { return; }
		if (!label.isConnected) { document.body.appendChild(label); }
		var active = document.activeElement;
		clicking = true;
		try {
			label.click();
			api.fired += 1;
			if (active && active !== document.activeElement && active.focus) { active.focus({ preventScroll: true }); }
		} finally {
			clicking = false;
		}
	}
	['touchend', 'pointerup', 'mouseup'].forEach(function (type) {
		document.addEventListener(type, function () {
			lastUp = performance.now();
			if (armed) {
				armed = false;
				api.pending = true;
				api.pendingAt = lastUp;
				armedFired = lastUp;
			}
			fire();
		}, { capture: true, passive: true });
	});
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2500932,"index.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
